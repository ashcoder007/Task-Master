services:
  - type: web
    name: taskmaster
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w frontend
    startCommand: npm run prisma:deploy -w backend && npm run start -w backend
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: taskmaster-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://taskmaster.onrender.com

databases:
  - name: taskmaster-db
    plan: free
    databaseName: taskmaster
