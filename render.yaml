services:
  - type: web
    name: taskmaster
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run prisma:deploy && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskmaster-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://taskmaster.onrender.com

databases:
  - name: taskmaster-db
    plan: free
    databaseName: taskmaster
